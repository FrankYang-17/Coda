[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-davinci"
version = "0.1.0"
description = "Task-adaptive video generation with coding agents and 3D proxies"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "openai>=1.66,<3", "anthropic>=0.49,<1", "httpx[http2]>=0.28.1,<0.29",
  "httpcore>=1.0.9,<1.1", "hyperframe>=6.1,<7", "PyYAML>=6,<7",
  "Pillow>=10", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[project.scripts]
coda-davinci = "coda_davinci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coda_davinci = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
